# GDELT DOC 2.0: worldwide coverage by keyword. On by default (ADR Q5);
# switch it off with `gdelt: {enabled: false}` in feeds.local.yaml or
# SKYNET_INTEL_GDELT=0. On 2026-10-24 it answered HTTP 429 to this service
# from the development machine; while that lasts, health shows http_429 and
# each query backs off to at most one request an hour.
gdelt:
  enabled: true
  terms_note: >-
    GDELT Project data is free and open for any use; any use or redistribution
    must cite the GDELT Project and link to https://www.gdeltproject.org/.
  queries:
    - id: gdelt-disasters
      name: GDELT · disasters
      category: disaster
      query: '(earthquake OR flood OR wildfire OR hurricane OR cyclone OR typhoon OR tsunami OR landslide) sourcelang:english'
    - id: gdelt-conflict
      name: GDELT · conflict
      category: conflict
      query: '(airstrike OR "missile strike" OR shelling OR ceasefire OR insurgents OR "armed clashes") sourcelang:english'
    - id: gdelt-cyber
      name: GDELT · cyber
      category: cyber
      query: '(ransomware OR cyberattack OR "data breach" OR "zero-day") sourcelang:english'
    - id: gdelt-health
      name: GDELT · outbreaks
      category: health
      query: '(outbreak OR epidemic OR cholera OR mpox OR ebola OR "bird flu") sourcelang:english'

