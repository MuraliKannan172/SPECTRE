# SKYNET intel: shipped news sources.
#
# terms: open      polled by default. Only sources whose reuse terms were
#                  checked and allow it: US federal works (public domain),
#                  GOV.UK (Open Government Licence v3.0), European Commission
#                  (reuse policy, CC BY 4.0), GDELT (open, citation required).
# terms: personal  polled only while "Non-commercial sources" is on in
#                  Provider Settings (SKYNET_NONCOMMERCIAL_SOURCES=1): terms
#                  that say personal or non-commercial use, or that have not
#                  been checked ("not checked" in terms_note).
#
# Only headline, short summary, source, link and time are stored; never
# article bodies. Every feed URL here passed intel/scripts/verify_feeds.py
# (HTTP 200, parses, at least one item, newest item under 90 days old); see
# docs/phase2/feed-verification.md. The GDELT queries below did not: GDELT
# answered HTTP 429 at verification time (see the note there). The GOV.UK and
# European Commission terms were read on 2026-10-25. Add or disable feeds in a gitignored
# intel/feeds.local.yaml (same shape; entries merge by id).

