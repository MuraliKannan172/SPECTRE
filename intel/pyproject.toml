[project]
name = "spectre-intel"
version = "0.1.0"
description = "SPECTRE intel service: real-time news ingest, dedupe, geoparse and search behind /api/intel."
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.28",
  "feedparser>=6.0.11",
  "rapidfuzz>=3.10",
  "pyyaml>=6.0.2",
  "spacy>=3.8,<3.9",
  "en_core_web_sm",
  "jsonschema>=4.23",
  "ddgs>=9.0",
  "trafilatura>=2.0",
  "keyring==25.7.0",
  "anthropic==2.3.0",
  "openai==3.41.0",
]

[project.optional-dependencies]
# Local voice for the Neural Core (opt-in: uv sync --project intel --extra voice).
# kokoro-onnx pulls in phonemizer and espeak-ng, which are GPL-3.0; see NOTICE.md.
voice = [
  "faster-whisper>=1.2,<2",
  "av>=16,<19",  # av 19 dropped an argument faster-whisper 1.2 passes to av.open
  "kokoro-onnx>=0.6,<0.7",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"scripts/*" = ["S310"]

[tool.uv]
package = false

[tool.uv.sources]
en_core_web_sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
