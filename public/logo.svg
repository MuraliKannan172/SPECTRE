<svg xmlns="http://www.w3.org/2000/svg" viewBox="180 120 775 520" role="img" aria-labelledby="logo-title">
  <title id="logo-title">SPECTRE</title>
  <!-- SPECTRE mark: a globe inside a targeting reticle. The reticle (#shell)
       stays fixed; src/logoGaze.js moves #globe and #globe_cage toward the
       pointer, so keep those two ids. Colours follow src/branding.js. -->
  <defs>
    <radialGradient id="globe-fill" cx="0.4" cy="0.36" r="0.72">
      <stop offset="0" stop-color="#3a0700" />
      <stop offset="0.55" stop-color="#140200" />
      <stop offset="1" stop-color="#000000" />
    </radialGradient>
    <radialGradient id="core-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd2c4" />
      <stop offset="0.35" stop-color="#ff2800" />
      <stop offset="1" stop-color="#d40000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <g id="shell" fill="none" stroke="#ff2800" stroke-linecap="square">
    <circle cx="567.5" cy="380" r="232" stroke-width="6" stroke-opacity="0.6" />
    <circle cx="567.5" cy="380" r="250" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="8 16" />
    <path d="M567.5 128v36M567.5 596v36" stroke-width="8" />
    <path d="M310 290H236V470H310M825 290H899V470H825" stroke-width="12" />
    <path d="M196 380H300M835 380H939" stroke-width="4" stroke-opacity="0.6" />
  </g>
  <g id="globe">
    <circle cx="567.5" cy="380" r="150" fill="url(#globe-fill)" stroke="#d40000" stroke-width="6" />
    <circle cx="567.5" cy="380" r="46" fill="url(#core-glow)" />
    <circle cx="567.5" cy="380" r="14" fill="#ff2800" />
  </g>
  <g id="globe_cage" fill="none" stroke="#ff2800" stroke-width="3" stroke-opacity="0.75">
    <ellipse cx="567.5" cy="380" rx="104" ry="150" />
    <ellipse cx="567.5" cy="380" rx="48" ry="150" />
    <path d="M567.5 230V530M417.5 380H717.5M429.5 322H705.5M429.5 438H705.5M471 266H664M471 494H664" />
  </g>
</svg>
