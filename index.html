<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{brand.name}}</title>
  <meta name="description" content="{{brand.description}}" />
  <!-- Raster fallbacks: Safari ignores an SVG apple-touch-icon and falls back to a
       screenshot of the page, so an installed app needs a real PNG. Regenerate
       these from the logo with `node scripts/generate-icons.mjs`. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
  <!-- Listed after the PNG: browsers that use the last usable icon keep the SVG
       for the tab. -->
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="{{brand.background}}" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="{{brand.shortName}}" />
  <!-- SKYNET: bundled fonts (no runtime Google Fonts calls), the upstream
       stylesheet, then the SKYNET theme last so it wins by order. Removing the
       two src/theme lines returns the upstream look. -->
  <link rel="stylesheet" href="/src/theme/skynet-fonts.css" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/src/theme/skynet-recolor.css" />
  <link rel="stylesheet" href="/src/theme/skynet.css" />
</head>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
