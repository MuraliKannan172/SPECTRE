<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- SPECTRE: black from the first paint, before any stylesheet loads. The
       cover hides the page until src/boot/entry.js swaps in the boot overlay
       (or removes it with the boot animation off); if that script never runs,
       the cover hides itself after 10 s. -->
  <style>
    html, body { background: #000; }
    #spectre-boot-cover {
      position: fixed; inset: 0; z-index: 2147483000;
      background: #000; pointer-events: none;
      animation: spectre-boot-cover-out 0s 10s forwards;
    }
    @keyframes spectre-boot-cover-out { to { visibility: hidden; } }
  </style>
  <title>{{brand.title}}</title>
  <meta name="description" content="{{brand.description}}" />
  <!-- SPECTRE emblem icons from public/brand/ (drawn by hand; only the
       maskable install icon is generated, by `node scripts/generate-icons.mjs`).
       Safari ignores an SVG apple-touch-icon, so the installed app gets a PNG. -->
  <link rel="icon" href="/brand/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon-180.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{{brand.title}}" />
  <meta property="og:description" content="{{brand.description}}" />
  <meta property="og:image" content="/brand/spectre-social-1280x640.png" />
  <meta property="og:image:width" content="1280" />
  <meta property="og:image:height" content="640" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="/brand/spectre-social-1280x640.png" />
  <meta name="theme-color" content="{{brand.background}}" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="{{brand.shortName}}" />
  <!-- SPECTRE: bundled fonts (no runtime Google Fonts calls), the upstream
       stylesheet, then the SPECTRE theme last so it wins by order. Removing the
       two src/theme lines returns the upstream look. -->
  <link rel="stylesheet" href="/src/theme/spectre-fonts.css" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/src/theme/spectre-recolor.css" />
  <link rel="stylesheet" href="/src/theme/spectre.css" />
  <link rel="stylesheet" href="/src/theme/spectre-news.css" />
  <link rel="stylesheet" href="/src/theme/spectre-neural-core.css" />
  <!-- SPECTRE boot loader (src/boot/): its two largest layers, then its
       styles last. -->
  <link rel="preload" as="image" href="/brand/spectre-mark.png" />
  <link rel="preload" as="image" href="/brand/spectre-wordmark.png" />
  <link rel="stylesheet" href="/src/theme/spectre-boot.css" />
</head>
<body>
  <div id="spectre-boot-cover" aria-hidden="true"></div>

  <!-- gev:template scene-chrome -->

  <!-- gev:template cockpit -->

  <!-- gev:template display-controls -->

  <!-- gev:template command-dock -->

  <!-- gev:template layer-panels -->

  <!-- gev:template context -->

  <!-- gev:template welcome -->

  <!-- gev:template provider-settings -->

  <!-- gev:template hud-loading -->

  <!-- Module scripts run in order: the boot overlay starts before the app. -->
  <script type="module" src="/src/boot/entry.js"></script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
